schema_version: 1

context:
  name: kinisi
  version: "2.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/kinisi-${{ version }}.tar.gz
  sha256: f20e276e4c76adae058e6a68c7b4c32a6f78ec47d14e1e5b7c4d744693c6a478
  patches:
    - bs4.patch

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - bs4 >=0.0.2
    - dynesty >=2.1.5
    - emcee >=3.1.6
    - scipp >=24.8.0
    - uncertainties >=3.2.3
    - python >=${{ python_min }}
    - numpy >=2.0.0
    - scikit-learn >=1.5.0
    - scipy >=1.9.3
    - tqdm
    - uravu >=1.3.0
    - statsmodels >=0.14.0
    - beautifulsoup4

tests:
  - python:
      imports:
        - kinisi
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Efficient estimation of diffusion processes from molecular dynamics.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/bjmorgan/kinisi

extra:
  recipe-maintainers:
    - jan-janssen
